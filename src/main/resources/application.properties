spring.application.name=skincare

spring.datasource.url=jdbc:postgresql://${DB_URL}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#24 hours for local testing, 15 min is good
jwt.access-token-expiration=86400000
#7 days
jwt.refresh-token-expiration=604800000

app.security.disposable-email=10minutemail,20minute,1,1@gmail.com,ail,33mail,5ymail,anonbox,guerillamemail,mailinator,mailnesia
spring.config.import=optional:file:.env.properties

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.web.resources.static-locations=file:storage/
